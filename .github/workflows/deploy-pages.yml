name: Deploy na GitHub Pages

# Publikacja automatyczna po każdym pushu do main (w tym po zapisie z Pages CMS)
# oraz ręcznie z zakładki Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ujawnia wpisy zaplanowane na dany dzień (wpisy z przyszłą datą są pomijane
    # w buildzie, patrz src/_data/wpisy.js). Dwa przebiegi dziennie: 06:20 UTC
    # (08:20 CEST) publikuje poranne wpisy z marginesem po pełnej godzinie,
    # 12:20 UTC to zapas na wypadek zgubionego/opóźnionego pierwszego runu
    # (GitHub potrafi opóźniać crony o kilkadziesiąt minut albo pominąć run).
    - cron: "20 6,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalacja zależności
        run: npm ci
      - name: Build + indeks Pagefind
        run: npm run build
      - name: Weryfikacja builda
        run: npm run check
      - name: Konfiguracja Pages
        uses: actions/configure-pages@v6
      - name: Spakowanie strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy na Pages
        id: deployment
        uses: actions/deploy-pages@v5
