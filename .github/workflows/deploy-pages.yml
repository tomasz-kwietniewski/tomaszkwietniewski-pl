name: Deploy na GitHub Pages

# Publikacja automatyczna po każdym pushu do main (w tym po zapisie z Pages CMS)
# oraz ręcznie z zakładki Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalacja zależności
        run: npm ci
      - name: Build + indeks Pagefind
        run: npm run build
      - name: Weryfikacja builda
        run: npm run check
      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5
      - name: Spakowanie strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy na Pages
        id: deployment
        uses: actions/deploy-pages@v5
