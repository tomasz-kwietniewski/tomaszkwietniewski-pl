name: Deploy na GitHub Pages

# Publikacja automatyczna po każdym pushu do main (w tym po zapisie z Pages CMS)
# oraz ręcznie z zakładki Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ujawnia wpisy zaplanowane na dany dzień (wpisy z przyszłą datą są pomijane
    # w buildzie, patrz src/_data/wpisy.js). Trzy przebiegi dziennie, każdy
    # 20 minut po pełnej godzinie, żeby dać margines wpisom planowanym na równą:
    # 05:20 UTC (07:20 CEST) dla wpisów na 7:00, 06:20 UTC (08:20 CEST) dla
    # wpisów na 8:00, a 12:20 UTC to zapas na wypadek zgubionego albo
    # opóźnionego wcześniejszego runu (GitHub potrafi opóźniać crony
    # o kilkadziesiąt minut albo pominąć run).
    - cron: "20 5,6,12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Sekret nie moze stac wprost w `if:` - flaga mowi, czy klucz do repo Momentum jest ustawiony.
      MOMENTUM_KEY_SET: ${{ secrets.MOMENTUM_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Miniatury YouTube między buildami - bez cache każdy run (push + 2x cron)
      # pobierałby je od nowa z img.youtube.com (zależność builda od sieci).
      - name: Cache miniatur YouTube
        uses: actions/cache@v4
        with:
          path: _yt-cache
          key: yt-thumbs-${{ hashFiles('content/wpisy/**') }}
          restore-keys: yt-thumbs-
      # Warianty WebP z shortcode'u "obrazek" - bez cache każdy run przetwarzałby
      # ~100 obrazków od zera (sharp).
      - name: Cache przetworzonych obrazków
        uses: actions/cache@v4
        with:
          path: _img-cache
          key: img-opt-${{ hashFiles('media/**', 'src/assets/img/**') }}
          restore-keys: img-opt-
      - name: Instalacja zależności
        run: npm ci
      # Plansza demo Momentum Strategy (/projekty/momentum-demo/): sygnał GEM, momentum,
      # historia sygnałów, krzywa kapitału i Larsson Line z prawdziwych notowań (yfinance),
      # przeliczane przy każdym deployu (push + 3x cron). Kod z PRYWATNEGO repo
      # momentum-strategy, klucz deploy tylko do odczytu w sekrecie MOMENTUM_DEPLOY_KEY.
      # Generator nigdy nie czyta stanu aplikacji (pozycji, historii transakcji).
      # Każda awaria = deploy idzie dalej z wersją zacommitowaną w demo/momentum
      # (widoczna data "stan na"), a w podsumowaniu runu pojawia się ostrzeżenie.
      - name: Kod Momentum (prywatne repo, tylko odczyt)
        id: momentum
        if: env.MOMENTUM_KEY_SET == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: tomasz-kwietniewski/momentum-strategy
          ref: master
          ssh-key: ${{ secrets.MOMENTUM_DEPLOY_KEY }}
          path: _momentum
          persist-credentials: false
      - name: Python dla planszy Momentum
        id: momentum-python
        if: steps.momentum.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: _momentum/requirements.lock
      - name: Plansza demo Momentum (GEM na prawdziwych notowaniach)
        id: momentum-demo
        if: steps.momentum-python.outcome == 'success'
        continue-on-error: true
        run: |
          pip install --quiet -r _momentum/requirements.lock
          python -W ignore _momentum/scripts/build_demo.py --real-gem --out demo/momentum
      - name: Ostrzeżenie - plansza Momentum z poprzedniej wersji
        if: steps.momentum-demo.outcome != 'success'
        run: echo "::warning title=Plansza Momentum::Nie przeliczono planszy demo (klucz, pip albo notowania). Publikuję wersję zacommitowaną w demo/momentum."
      - name: Build + indeks Pagefind
        run: npm run build
      - name: Weryfikacja builda
        run: npm run check
      - name: Konfiguracja Pages
        uses: actions/configure-pages@v6
      - name: Spakowanie strony
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy na Pages
        id: deployment
        uses: actions/deploy-pages@v5
